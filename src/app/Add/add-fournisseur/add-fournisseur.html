<div class="flex">
  <div class="w-fit h-fit">
    <app-nav-bar></app-nav-bar>
  </div>
  <div class="flex flex-col w-full">
    <div class="w-full p-2 flex items-center">
      <div class="flex-1"></div>
      <div class="flex-1"></div>

      <div class="flex-1 flex justify-end mt-4">
        <button
          class="rounded-lg p-2 bg-blue-500 text-white hover:bg-blue-600"
          (click)="logout()"
        >
          <fa-icon [icon]="faSignOut"></fa-icon>
          Deconnexion
        </button>
      </div>
    </div>
    <div class="p-4">
      <h1 class="text-xl font-semibold text-center">Ajouter un Fournisseur</h1>

      <form [formGroup]="AddFournissuer" class="mt-6 space-y-4">
        <div class="flex space-x-4 justify-center">
          <div class="mb-4 w-1/3">
            <label for="nom" class="block text-gray-700 font-semibold mb-2"
              >Nom</label
            >
            <input
              formControlName="nom"
              type="text"
              id="nom"
              name="nom"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300"
            />
          </div>

          <div class="mb-4 w-1/3">
            <label for="prenom" class="block text-gray-700 font-semibold mb-2"
              >Prénom</label
            >
            <input
              formControlName="prenom"
              type="text"
              id="prenom"
              name="prenom"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300"
            />
          </div>
        </div>
        <div class="flex space-x-4 justify-center">
          <div class="mb-4 w-1/3">
            <label for="email" class="block text-gray-700 font-semibold mb-2"
              >Email</label
            >
            <input
              formControlName="email"
              type="email"
              id="email"
              name="email"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300"
            />
          </div>
          <div class="mb-4 w-1/3">
            <label for="adresse" class="block text-gray-700 font-semibold mb-2"
              >Adresse</label
            >
            <input
              formControlName="Adresse"
              type="text"
              id="adresse"
              name="adresse"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300"
            />
          </div>
        </div>
        <div class="flex space-x-4 justify-center">
          <div class="mb-4 w-1/3">
            <label
              for="dateNaissance"
              class="block text-gray-700 font-semibold mb-2"
              >Date de naissance</label
            >
            <input
              formControlName="DateNaissance"
              type="date"
              id="dateNaissance"
              name="dateNaissance"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300"
            />
          </div>
          <div class="mb-4 w-1/3">
            <label for="produit" class="block text-gray-700 font-semibold mb-2"
              >produit</label
            >
            <select
              formControlName="produit"
              id="produit"
              name="produit"
              required
              multiple
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300"
            >
              <option value="" disabled selected>
                Choisir un ou plusieur produit
              </option>
              @for (produit of produits; track $index) {
              <option [value]="produit.id">
                {{ produit.libelle }}
              </option>
              }
            </select>
          </div>
        </div>

        <div class="text-center">
          <button
            (click)="AddNewFournisseur()"
            type="submit"
            class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600"
          >
            Ajouter fournisseur
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
