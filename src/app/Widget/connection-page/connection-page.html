<div class="min-h-screen flex flex-col justify-center items-center bg-gray-100">
  <div
    class="flex flex-col h-1/2 w-1/4 justify-center items-center border border-gray-100 rounded-lg gap-4 p-8 shadow-lg bg-white"
  >
    <h2 class="text-2xl font-bold mb-4">Connexion</h2>
    <form [formGroup]="loginForm" class="w-full">
      <div class="flex flex-col w-full">
        <label for="email" class="mb-1 px-1 font-semibold">Email</label>
        <input
          type="text"
          id="email"
          class="border border-gray-300 focus:ring-2 focus:ring-blue-300 focus:border-blue-200 outline-none rounded-lg w-full py-2 px-3"
          formControlName="email"
        />
      </div>
      <div class="flex flex-col w-full">
        <label for="password" class="mb-1 px-1 font-semibold"
          >Mot de passe</label
        >
        <input
          type="password"
          class="border border-gray-300 focus:ring-2 focus:ring-blue-200 focus:border-blue-300 outline-none rounded-lg w-full py-2 px-3"
          id="password"
          formControlName="password"
        />
      </div>
    </form>
    <button
      (click)="Connection()"
      class="bg-blue-500 hover:bg-blue-700 text-white px-4 py-2 rounded-lg"
    >
      Se connecter
    </button>
  </div>
</div>
